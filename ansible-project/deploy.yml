---
- name: Deploy Docker Web App
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    image_name: "abdur201/docker-test"

  tasks:
    - name: Pull Docker image from Hub
      shell: "docker pull {{ image_name }}:latest"

    - name: Set dynamic container name and port
      set_fact:
        container_name: "app_{{ ansible_date_time.epoch }}"
        app_port: "{{ 8000 | range(9000) | random }}"

    - name: Run Docker container instance
      shell: "docker run -d --name {{ container_name }} -p {{ app_port }}:80 {{ image_name }}:latest"

    - name: Show deployment results
      debug:
        msg: "Container {{ container_name }} is active on port {{ app_port }}"
