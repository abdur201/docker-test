

- name: Deploy Web App with Dynamic Ports
  hosts: web-servers
  become: yes

  vars:
    random_port: "{{ 30000 | range(31000) | random }}"
    container_name: "docker-test-{{ ansible_date_time.epoch }}"
    # Docker Hub bilgilerin (Buraya kendi bilgilerini yaz)
    docker_user: "abdur201"
    docker_password: "DOCKER_HUB_SIFREN_VEYA_TOKENIN" 

  tasks:
    - name: Fix Docker Desktop Credential Error
      shell: "rm -f ~/.docker/config.json /root/.docker/config.json"
      ignore_errors: yes

    - name: Log into Docker Hub
      shell: "echo {{ docker_password }} | docker login --username {{ docker_user }} --password-stdin"

    - name: Pull latest image
      shell: "docker pull abdur201/docker-test:latest"

    - name: Run New Container
      docker_container:
        name: "{{ container_name }}"
        image: abdur201/docker-test:latest
        state: started
        published_ports:
          - "{{ random_port }}:80"
