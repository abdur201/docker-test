---
- name: Deploy Docker Web App
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Login to Docker Hub
      shell: "echo '{{ my_docker_password }}' | docker login --username abdrak --password-stdin"

    - name: Pull Docker image from Hub
      shell: "docker pull abdrak/docker-test:latest"

    - name: Run New Container with Random Port
      docker_container:
        # Her seferinde benzersiz isim (Zaman damgası ile)
        name: "test-app-{{ ansible_date_time.epoch }}"
        image: abdrak/docker-test:latest
        state: started
        restart_policy: always
        published_ports:
          # 0 yazarsak Docker boş olan rastgele bir portu otomatik atar
          - "0:80"
