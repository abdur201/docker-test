name: CI/CD - Build, Test and Push Docker Image

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: abdrak/docker-test
  AWX_HOST: "172.31.186.158" 

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. TEST: HTML Sözdizimi Kontrolü (Linting)
      - name: HTML Syntax Check (Lint)
        run: |
          # Self-hosted sunucunda npm (Node.js) kurulu olmalıdır.
          npm install -g htmlhint || echo "npm bulunamadı, bu adım atlanıyor."
          htmlhint "**/*.html" || true

      # 2. TEST İÇİN YEREL İMAJ OLUŞTURMA
      # Çoklu platform (multi-arch) build uzun sürdüğü için, 
      # sadece test amaçlı imajı
      - name: Build local image for testing
        run: docker build -t local-test-image:latest .

      # 3. TEST: Nginx Config Doğrulama
      # nginx.conf'ta hata varsa süreç burada kesilir (Push yapılmaz).
      - name: Nginx Config Syntax Test
        run: docker run --rm local-test-image:latest nginx -t

     # 4. TEST: Smoke Test (Canlılık Kontrolü)
      - name: Run Smoke Test
        run: |
          
          docker rm -f smoke-test-container || true
          
        
          docker run -d --name smoke-test-container -p 8088:80 local-test-image:latest
          sleep 5
          
         
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:8088)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Hata: Site açılmadı! HTTP Kodu: $HTTP_STATUS"
            docker rm -f smoke-test-container
            exit 1
          else
            echo "Başarılı: Site HTTP 200 OK ile yanıt veriyor."
            docker rm -f smoke-test-container
          fi

      # 5. DOCKER HUB'A GİRİŞ
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: abdrak
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. DOCKER BUILDX KURULUMU
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. ASIL İMAJI OLUŞTUR VE DOCKER HUB'A PUSHLA
   
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ env.IMAGE_NAME }}:latest

      # 8. AWX DEPLOY İŞLEMİNİ TETİKLEME
      
      - name: Trigger AWX Job Template
        run: |
          curl -L -X POST \
          -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
          -H "Content-Type: application/json" \
          "http://${{ env.AWX_HOST }}:8080/api/v2/job_templates/9/launch/"
