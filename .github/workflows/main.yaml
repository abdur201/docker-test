name: CI - Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/abdur201/docker-test
  
  AWX_HOST: "172.31.186.158" 

jobs:
  build-and-push:
    runs-on: [self-hosted, abdu]
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ env.IMAGE_NAME }}:latest

     
      - name: Trigger AWX Job Template
        run: |
          curl -f -X POST \
          -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
          -H "Content-Type: application/json" \
          http://${{ env.AWX_HOST }}:8080/api/v2/job_templates/9/launch/
